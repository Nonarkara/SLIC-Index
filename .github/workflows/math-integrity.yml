name: Math Integrity
permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Install PDF dependency
        run: python -m pip install reportlab

      - name: Check public CSV export
        run: npm run check:csv

      - name: Rescore publication snapshot
        run: npm run rescore

      - name: Check publication integrity
        run: npm run check:publication

      - name: Check methodology drift
        run: npm run check:methodology

      - name: Check translations
        run: npm run check:translations

      - name: Run regression tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Regenerate methodology PDF
        run: npm run methodology:pdf

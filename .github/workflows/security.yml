name: Security scan

# Report-only. Findings are uploaded and summarized. They do not fail this workflow.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  scan:
    name: Report-only scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Semgrep OSS 1.180.0
        run: |
          if ! python3 -m venv "$RUNNER_TEMP/semgrep-venv"; then
            sudo apt-get update
            sudo apt-get install -y python3-venv
            python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          fi
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --disable-pip-version-check "semgrep==1.180.0"
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" --version

      - name: Run Semgrep OSS
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          set +e
          semgrep scan \
            --oss-only \
            --metrics=off \
            --disable-version-check \
            --no-secrets-validation \
            --no-error \
            --timeout 30 \
            --max-target-bytes 5000000 \
            --exclude dist \
            --exclude node_modules \
            --exclude .git \
            --exclude "*.pdf" \
            --exclude "*.jpg" \
            --exclude "*.jpeg" \
            --exclude "*.png" \
            --exclude "*.xlsx" \
            --exclude "*.pptx" \
            --config p/javascript \
            --config p/typescript \
            --config p/python \
            --config p/react \
            --config p/nodejs \
            --config p/secrets \
            --config p/github-actions \
            --sarif-output semgrep.sarif \
            >"$RUNNER_TEMP/semgrep.out" \
            2>"$RUNNER_TEMP/semgrep.err"
          status=$?
          set -e
          echo "Semgrep finished with exit ${status}. The exit code is ignored."
          if [ ! -s semgrep.sarif ]; then
            echo "Semgrep wrote no SARIF. An empty report will be used."
            printf '%s\n' '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"semgrep","rules":[]}},"results":[]}]}' > semgrep.sarif
          fi
          exit 0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          cache: "false"
          hide-progress: true
          timeout: 20m
          skip-dirs: .git,node_modules
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Write job summary
        if: always()
        run: node .github/scripts/security-summary.mjs semgrep.sarif trivy.sarif

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep-oss
          wait-for-processing: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
          wait-for-processing: true

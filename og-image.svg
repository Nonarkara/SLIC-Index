<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1260" viewBox="0 0 2400 1260">
  <rect width="2400" height="1260" fill="#f8f5f0"/>

  <!-- Outer hairline frame (subtle, editorial) -->
  <rect x="64" y="64" width="2272" height="1132" fill="none" stroke="rgba(28,25,20,0.18)" stroke-width="2"/>

  <!-- Single amber dot, top-right -->
  <rect x="2288" y="96" width="16" height="16" fill="#b85c28"/>

  <!-- LEFT COLUMN (60%) -->
  <g transform="translate(96, 96)">
    <!-- Eyebrow -->
    <text x="0" y="48" font-family="JetBrains Mono, ui-monospace, monospace" font-size="28" fill="#1c1914" fill-opacity="0.7" letter-spacing="5.6" font-weight="500">SMART AND LIVEABLE CITIES INDEX &#183; 2026</text>

    <!-- Hairline under eyebrow -->
    <line x1="0" y1="96" x2="1277" y2="96" stroke="#1c1914" stroke-opacity="0.2" stroke-width="2"/>

    <!-- Headline: SLIC V3 -->
    <text x="-12" y="380" font-family="Libre Baskerville, Georgia, serif" font-style="italic" font-size="284" fill="#1c1914" font-weight="400" letter-spacing="-4">SLIC V3</text>

    <!-- Sub-headline -->
    <text x="0" y="500" font-family="Libre Baskerville, Georgia, serif" font-size="52" fill="#1c1914" fill-opacity="0.85" font-weight="400">163 cities. 5 pillars. 20 scored metrics.</text>
    <text x="0" y="568" font-family="Libre Baskerville, Georgia, serif" font-style="italic" font-size="52" fill="#1c1914" fill-opacity="0.85" font-weight="400">No tier inflation.</text>

    <!-- Bottom hairline + wordmark -->
    <line x1="0" y1="988" x2="1277" y2="988" stroke="#1c1914" stroke-opacity="0.2" stroke-width="2"/>
    <text x="0" y="1038" font-family="JetBrains Mono, ui-monospace, monospace" font-size="28" fill="#1c1914" fill-opacity="0.75" letter-spacing="2.8">nonarkara.github.io/SLIC-Index</text>
  </g>

  <!-- RIGHT COLUMN (40%) -->
  <g transform="translate(1469, 96)">
    <!-- Eyebrow -->
    <text x="0" y="48" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" fill="#1c1914" letter-spacing="3.2" font-weight="500">
      <tspan fill="#b85c28" font-weight="700">&#945;</tspan><tspan dx="14">ALPHA &#183; TOP 10</tspan>
    </text>

    <!-- Hairline between eyebrow and list -->
    <line x1="0" y1="80" x2="835" y2="80" stroke="#1c1914" stroke-width="2"/>

    <!-- Numbered list (10 items, 36px JetBrains Mono ~ 18px @ 1x) -->
    <g transform="translate(0, -100)">
      
      <text x="0" y="280" font-family="JetBrains Mono, ui-monospace, monospace" font-size="36" fill="#1c1914" letter-spacing="0">
        <tspan fill="#1c1914" fill-opacity="0.45">01</tspan><tspan dx="32" font-weight="500">Raleigh</tspan><tspan fill="#1c1914" fill-opacity="0.55"> &#183; United States</tspan>
      </text>
      <text x="0" y="344" font-family="JetBrains Mono, ui-monospace, monospace" font-size="36" fill="#1c1914" letter-spacing="0">
        <tspan fill="#1c1914" fill-opacity="0.45">02</tspan><tspan dx="32" font-weight="500">Montreal</tspan><tspan fill="#1c1914" fill-opacity="0.55"> &#183; Canada</tspan>
      </text>
      <text x="0" y="408" font-family="JetBrains Mono, ui-monospace, monospace" font-size="36" fill="#1c1914" letter-spacing="0">
        <tspan fill="#1c1914" fill-opacity="0.45">03</tspan><tspan dx="32" font-weight="500">Kaohsiung</tspan><tspan fill="#1c1914" fill-opacity="0.55"> &#183; Taiwan</tspan>
      </text>
      <text x="0" y="472" font-family="JetBrains Mono, ui-monospace, monospace" font-size="36" fill="#1c1914" letter-spacing="0">
        <tspan fill="#1c1914" fill-opacity="0.45">04</tspan><tspan dx="32" font-weight="500">Eindhoven</tspan><tspan fill="#1c1914" fill-opacity="0.55"> &#183; Netherlands</tspan>
      </text>
      <text x="0" y="536" font-family="JetBrains Mono, ui-monospace, monospace" font-size="36" fill="#1c1914" letter-spacing="0">
        <tspan fill="#1c1914" fill-opacity="0.45">05</tspan><tspan dx="32" font-weight="500">Graz</tspan><tspan fill="#1c1914" fill-opacity="0.55"> &#183; Austria</tspan>
      </text>
      <text x="0" y="600" font-family="JetBrains Mono, ui-monospace, monospace" font-size="36" fill="#1c1914" letter-spacing="0">
        <tspan fill="#1c1914" fill-opacity="0.45">06</tspan><tspan dx="32" font-weight="500">Taipei</tspan><tspan fill="#1c1914" fill-opacity="0.55"> &#183; Taiwan</tspan>
      </text>
      <text x="0" y="664" font-family="JetBrains Mono, ui-monospace, monospace" font-size="36" fill="#1c1914" letter-spacing="0">
        <tspan fill="#1c1914" fill-opacity="0.45">07</tspan><tspan dx="32" font-weight="500">Jeju City</tspan><tspan fill="#1c1914" fill-opacity="0.55"> &#183; South Korea</tspan>
      </text>
      <text x="0" y="728" font-family="JetBrains Mono, ui-monospace, monospace" font-size="36" fill="#1c1914" letter-spacing="0">
        <tspan fill="#1c1914" fill-opacity="0.45">08</tspan><tspan dx="32" font-weight="500">Valparaiso</tspan><tspan fill="#1c1914" fill-opacity="0.55"> &#183; Chile</tspan>
      </text>
      <text x="0" y="792" font-family="JetBrains Mono, ui-monospace, monospace" font-size="36" fill="#1c1914" letter-spacing="0">
        <tspan fill="#1c1914" fill-opacity="0.45">09</tspan><tspan dx="32" font-weight="500">Bangkok</tspan><tspan fill="#1c1914" fill-opacity="0.55"> &#183; Thailand</tspan>
      </text>
      <text x="0" y="856" font-family="JetBrains Mono, ui-monospace, monospace" font-size="36" fill="#1c1914" letter-spacing="0">
        <tspan fill="#1c1914" fill-opacity="0.45">10</tspan><tspan dx="32" font-weight="500">Fukuoka</tspan><tspan fill="#1c1914" fill-opacity="0.55"> &#183; Japan</tspan>
      </text>
    </g>

    <!-- Bottom hairline + meta -->
    <line x1="0" y1="988" x2="835" y2="988" stroke="#1c1914" stroke-opacity="0.2" stroke-width="2"/>
    <text x="0" y="1038" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" fill="#1c1914" fill-opacity="0.55" letter-spacing="2.4">RED DOT &#183; EDITORIAL EDITION</text>
  </g>
</svg>
<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>SLIC Index</title>
    <script>
      // GitHub Pages SPA redirect — preserve the full path + query + hash
      // by encoding them into the URL's query string before redirecting to index.html.
      // The receiving index.html will decode and restore the history entry.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') +
        '/?p=' + encodeURIComponent(l.pathname.slice(1) + (l.search ? '&' + l.search.slice(1) : '') + l.hash)
      );
    </script>
  </head>
  <body></body>
</html>
